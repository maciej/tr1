version = 1
name = "tr1"

[setup]
script = '''
set -eu

common_dir=$(git rev-parse --path-format=absolute --git-common-dir)
source_root=$(dirname "$common_dir")
target_root=$(pwd)

if [ "$source_root" != "$target_root" ]; then
  if [ -f "$source_root/.env" ]; then
    cp -p "$source_root/.env" "$target_root/.env"
  fi

  if [ -d "$source_root/assets" ]; then
    mkdir -p "$target_root/assets"
    find "$source_root/assets" -maxdepth 1 -type f \( \
      -name '*.mp3' -o \
      -name '*.wav' -o \
      -name '*.aiff' -o \
      -name '*.json' \
    \) -exec cp -p {} "$target_root/assets/" \;
  fi
fi
'''
